<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أحبك 🤍</title>

<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(#050816,#0d1b3d);
overflow:hidden;
font-family:Tahoma,sans-serif;
color:white;
}

.box{
text-align:center;
padding:30px;
z-index:2;
}

h1{
font-size:45px;
margin-bottom:20px;
animation:pulse 2s infinite;
}

p{
font-size:22px;
line-height:2;
}

.heart{
position:absolute;
top:-30px;
font-size:25px;
animation:fall linear infinite;
opacity:.8;
}

@keyframes fall{
0%{
transform:translateY(-50px);
}
100%{
transform:translateY(110vh);
}
}

@keyframes pulse{
0%,100%{
transform:scale(1);
}
50%{
transform:scale(1.08);
}
}
</style>
</head>

<body>

<div class="box">

<h1>❤️ أحبك يا عزوتي ❤️</h1>

<p>

شكراً لأنك دخلت هالرحلة.

يمكن هي مجرد صفحات...

لكن كل كلمة فيها طالعة من قلبي.

<br><br>

وأتمنى مهما صار...

نضل نختار بعض كل يوم.

🤍

</p>

</div>

<script>

for(let i=0;i<40;i++){

let h=document.createElement("div");

h.className="heart";

h.innerHTML="❤️";

h.style.left=Math.random()*100+"%";

h.style.animationDuration=(4+Math.random()*4)+"s";

h.style.fontSize=(20+Math.random()*20)+"px";

document.body.appendChild(h);

}

</script>

</body>
</html>
