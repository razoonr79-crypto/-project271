<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ذكرياتنا 🤍</title>

<style>

body{
margin:0;
background:#081425;
font-family:Tahoma;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
color:white;
padding:20px;
box-sizing:border-box;
}

.box{
width:340px;
max-width:100%;
background:rgba(255,255,255,.08);
padding:25px;
border-radius:20px;
text-align:center;
backdrop-filter:blur(12px);
}

img{
width:100%;
height:320px;
object-fit:cover;
border-radius:15px;
background:#ddd;
}

h2{
margin-top:20px;
line-height:1.8;
}

button{
margin-top:20px;
padding:12px 35px;
border:none;
border-radius:30px;
background:#ff5d9e;
color:white;
font-size:18px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="box">

<img id="photo" src="IMG_1923.png" alt="صورة من ذكرياتنا">

<h2 id="text">
هنا بدأت أجمل قصة 🤍
</h2>

<button onclick="next()">
التالي ❤️
</button>

</div>

<script>

let photos = [

["IMG_1923.png","هنا بدأت أجمل قصة 🤍"],

["IMG_1925.png","كل مرة أشوفها أبتسم ❤️"],

["IMG_1926.jpeg","أجمل ذكرى عندي 🌸"],

["IMG_1927.png","وجودك لحاله يكفيني 🤍"],

["IMG_1928.png","أحب تفاصيلنا الصغيرة ✨"],

["IMG_1930.png","ولو رجع الزمن باختارك من جديد ❤️"],

["IMG_1929.jpeg","وهذي مو النهاية... هذي بداية عمرنا 🤍"]

];

let i = 0;

function next(){

i++;

if(i < photos.length){

document.getElementById("photo").src = photos[i][0];

document.getElementById("text").innerHTML = photos[i][1];

}else{

window.location.href = "love.html";

}

}

</script>

</body>

</html>
