<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>القفل 🔐</title>

<style>

body{
margin:0;
font-family:Tahoma,sans-serif;
background:#07111f;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
overflow:hidden;
}

.box{
background:rgba(255,255,255,.08);
padding:35px;
border-radius:20px;
text-align:center;
width:320px;
backdrop-filter:blur(10px);
}

input{
width:170px;
padding:12px;
font-size:22px;
text-align:center;
border:none;
border-radius:12px;
margin-top:20px;
}

button{
margin-top:20px;
padding:12px 35px;
border:none;
border-radius:30px;
background:#ff5d9e;
color:white;
font-size:18px;
cursor:pointer;
}

#error{
margin-top:15px;
color:#ffb3b3;
}

</style>

</head>

<body>

<div class="box">

<h2>🔐 افتح القفل</h2>

<p>

أدخل الرقم الذي بدأت به قصتنا 🤍

</p>

<input
type="password"
id="pass"
maxlength="3">

<br>

<button onclick="check()">

فتح

</button>

<p id="error"></p>

</div>

<script>

function check(){

let pass=document.getElementById("pass").value;

if(pass=="271"){

window.location.href="quiz.html";

}

else{

document.getElementById("error").innerHTML="هممم... أكيد تعرف الرقم الصحيح 🤍";

}

}

</script>

</body>
</html>
