<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لعزوتي ❤️</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(#07111f,#111b3a);
  font-family:Tahoma,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
  padding:20px;
}

.box{
  width:100%;
  max-width:380px;
  padding:28px 22px;
  border-radius:24px;
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(12px);
  text-align:center;
}

.counter{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin:22px 0;
}

.time-box{
  background:rgba(255,255,255,.09);
  border-radius:15px;
  padding:12px 5px;
}

.number{
  display:block;
  font-size:25px;
  color:#ff79b0;
  font-weight:bold;
}

.label{
  display:block;
  margin-top:5px;
  font-size:13px;
}

#message{
  line-height:2;
  min-height:220px;
  white-space:pre-line;
}

button{
  padding:13px 35px;
  border:none;
  border-radius:30px;
  background:#ff5d9e;
  color:white;
  font-size:18px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="box">
  <h2>🤍 من يوم 27/1/2025</h2>
  <p>وإحنا نكتب قصتنا سوا</p>

  <div class="counter">
    <div class="time-box">
      <span class="number" id="years">0</span>
      <span class="label">سنة</span>
    </div>

    <div class="time-box">
      <span class="number" id="months">0</span>
      <span class="label">شهر</span>
    </div>

    <div class="time-box">
      <span class="number" id="days">0</span>
      <span class="label">يوم</span>
    </div>

    <div class="time-box">
      <span class="number" id="hours">0</span>
      <span class="label">ساعة</span>
    </div>

    <div class="time-box">
      <span class="number" id="minutes">0</span>
      <span class="label">دقيقة</span>
    </div>

    <div class="time-box">
      <span class="number" id="seconds">0</span>
      <span class="label">ثانية</span>
    </div>
  </div>

  <div id="message"></div>

  <button onclick="location.href='end.html'">
    المفاجأة 🎁
  </button>
</div>

<script>
const startDate = new Date(2025, 0, 27, 0, 0, 0);

function updateCounter(){
  const now = new Date();

  let years = now.getFullYear() - startDate.getFullYear();
  let months = now.getMonth() - startDate.getMonth();
  let days = now.getDate() - startDate.getDate();

  if(days < 0){
    months--;
    const previousMonth = new Date(now.getFullYear(), now.getMonth(), 0);
    days += previousMonth.getDate();
  }

  if(months < 0){
    years--;
    months += 12;
  }

  document.getElementById("years").textContent = years;
  document.getElementById("months").textContent = months;
  document.getElementById("days").textContent = days;
  document.getElementById("hours").textContent =
    String(now.getHours()).padStart(2,"0");
  document.getElementById("minutes").textContent =
    String(now.getMinutes()).padStart(2,"0");
  document.getElementById("seconds").textContent =
    String(now.getSeconds()).padStart(2,"0");
}

updateCounter();
setInterval(updateCounter,1000);

const text = `يا عزوتي...

من يوم 27/1 وإنت مو بس شخص بحياتي،
إنت الأمان والسند والوجه اللي أحب أشوفه بكل أيامي.

يمكن نختلف ونزعل مرات،
لكن قلبي بكل مرة يرجع يختارك.

وجودك معي من أجمل الأشياء اللي صارتلي،
وأتمنى تظل قصتنا مستمرة للأبد ❤️`;

let i = 0;

function typeMessage(){
  if(i < text.length){
    document.getElementById("message").textContent += text.charAt(i);
    i++;
    setTimeout(typeMessage,35);
  }
}

typeMessage();
</script>

</body>
</html>
