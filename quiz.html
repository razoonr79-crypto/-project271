<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اللغز الأول</title>

<style>
body{
margin:0;
font-family:Tahoma,sans-serif;
background:#081323;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.box{
background:rgba(255,255,255,.08);
padding:35px;
border-radius:20px;
width:340px;
text-align:center;
backdrop-filter:blur(10px);
}

input{
width:220px;
padding:12px;
border:none;
border-radius:12px;
text-align:center;
font-size:18px;
margin-top:20px;
}

button{
margin-top:20px;
padding:12px 30px;
border:none;
border-radius:30px;
background:#ff5d9e;
color:white;
cursor:pointer;
font-size:18px;
}

#msg{
margin-top:15px;
color:#ffd4e3;
}
</style>

</head>

<body>

<div class="box">

<h2>🧩 أول لغز</h2>

<p>

وين المكان اللي جمعنا أول مرة؟ 🤍

</p>

<input
id="answer"
placeholder="اكتب جوابك">

<br>

<button onclick="check()">

التالي ❤️

</button>

<p id="msg"></p>

</div>

<script>

function check(){

let a=document.getElementById("answer").value.trim();

if(
a=="لفاح" ||
a=="مطعم لفاح"
){

window.location.href="gallery.html";

}

else{

document.getElementById("msg").innerHTML="مو هيك 🤍 حاول مرة ثانية";

}

}

</script>

</body>
</html>
